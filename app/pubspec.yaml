name: diff_note
description: "新人が口頭で教わったことをマニュアルへの差分として記録する"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.2
  markdown: ^7.3.1
  moon_design: ^1.1.0
  record: ^7.1.2
  shared_preferences: ^2.5.6
  web: ^1.1.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 使い方のスクショ。撮り直し方は assets/help/README.md
  assets:
    - assets/help/wide/
    - assets/help/narrow/
    # 発言者の顔（Open Peeps、CC0）。出どころは assets/avatars/README.md
    - assets/avatars/
  # Web では、ここに書いたフォントだけが最初の画面の前に読み終わる（fonts/README.md）
  fonts:
    - family: BIZUDPGothic
      fonts:
        - asset: fonts/BIZUDPGothic-Regular.ttf
        - asset: fonts/BIZUDPGothic-Bold.ttf
          weight: 700
  # パッケージの LICENSE に入っていない表示を、ビルドの assets/NOTICES に足す。
  # Lucide 本体は ISC で、写しに著作権表示と許諾文が要るが、lucide_icons_flutter は自分の MIT しか持たない
  licenses:
    - licenses/lucide.txt
    - fonts/BIZUDPGothic-OFL.txt
