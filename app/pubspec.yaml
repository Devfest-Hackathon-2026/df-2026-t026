name: diff_note
description: "新人が口頭で教わったことをマニュアルへの差分として記録する"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.2
  moon_design: ^1.1.0
  record: ^7.1.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Web では、ここに書いたフォントだけが最初の画面の前に読み終わる（fonts/README.md）
  fonts:
    - family: BIZUDPGothic
      fonts:
        - asset: fonts/BIZUDPGothic-Regular.ttf
        - asset: fonts/BIZUDPGothic-Bold.ttf
          weight: 700
