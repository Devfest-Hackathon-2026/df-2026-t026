name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# 値は infra の `terraform output github_variables` をリポジトリの Variables に入れたもの
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}

jobs:
  api:
    # GCP の準備（infra/README.md）が済むまではデプロイしない
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: ビルドして Cloud Run にデプロイ
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/diff-note/api:${{ github.sha }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" api
          docker push "$IMAGE"
          # イメージだけを差し替える。環境変数やサービスアカウントは Terraform が管理する
          gcloud run deploy diff-note-api --image "$IMAGE" --region "$REGION" --quiet

  web:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: ビルドして Firebase Hosting にデプロイ
        run: |
          API_URL=$(gcloud run services describe diff-note-api --region "$REGION" --format 'value(status.url)')
          flutter build web --release --dart-define=API_URL="$API_URL"
          npx --yes firebase-tools@15 deploy --only hosting --project "$PROJECT_ID" --non-interactive
