name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: api/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # Flutter のバージョンはローカル（FVM）と同じ .fvmrc から取る
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # 後処理は本番のデプロイで初めて動き、MoonIcons を差し替えられなくてもデプロイは止めない（元のフォントで出る）。
      # 差し替えを諦めたことに気づけるよう、ここでビルドして流し、差し替えていなければ落とす
      - name: Web をビルドして後処理を流す
        run: |
          flutter build web --release --dart-define=API_URL=https://example.invalid
          out=$(dart run tool/web_postbuild.dart https://example.invalid)
          echo "$out"
          if ! grep -qF '絞ったものに差し替えた' <<<"$out"; then
            echo "::error::MoonIcons.ttf を絞ったフォントに差し替えられなかった（理由は上の出力）。app/tool/moon_icons/README.md の「CI で落ちたとき」を見て直す"
            exit 1
          fi

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
